---
cisco_iosxe:
  platform: cisco_ios
  username: admin
  password: admin
  port: 22
  connection_options:
    netmiko:
      extras:
        device_type: cisco_ios
        secret: admin
    napalm:
      platform: ios          # NAPALM driver name — different from netmiko's cisco_ios
      extras:
        optional_args:
          secret: admin
          transport: ssh

cisco_ios:
  platform: cisco_ios
  username: admin
  password: admin
  port: 22
  connection_options:
    netmiko:
      extras:
        device_type: cisco_ios
        secret: admin
    napalm:
      platform: ios
      extras:
        optional_args:
          secret: admin
          transport: ssh

edge:
  data:
    role: edge

