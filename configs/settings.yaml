project:
  name: network-config-genai
  lab: cml
  vcs: github

polling:
  enabled: true
  command_config: "show running-config"
  command_logs: "show logging | last 50"
  interval_seconds: 300

storage:
  current_config_path: "data/configs/current"
  archive_config_path: "data/configs/archive"
  diff_path: "data/diffs"
  log_path: "data/logs"

ai:
  provider: gemini
  model: gemini-3.5-flash
  api_env_var: GEMINI_API_KEY
  include_topology: true
  include_old_config: true
  include_diff: true
  include_logs: true
  max_log_lines: 30
  temperature: 0.2

notifications:
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 465
    sender: your_email@example.com
    smtp_user_env_var: EMAIL_USERNAME
    smtp_pass_env_var: EMAIL_PASSWORD
    subject_prefix: "[NetConfig AI]"
    groups:
      executive:
        recipients:
      technical_manager:
        recipients:
      engineer:
        recipients:
          - syed.tawsif.ahmed@torontomu.ca

rollback:
  enabled: false